name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting, docs, and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: npm ci
      - run: python -m pip install -r requirements-ci.txt
      - name: Check JavaScript, TypeScript, JSON, YAML, and Markdown formatting
        run: npm run format:check
      - name: Lint and check Python formatting
        run: |
          ruff check scripts
          ruff format --check scripts
      - name: Validate documentation and OpenAPI
        run: |
          python scripts/check_docs.py
          python -m openapi_spec_validator docs/api/openapi.json
      - name: Validate development and production Compose models
        run: python scripts/check_environments.py

  backend:
    name: Go lint and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clims_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clims_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://clims_ci:ci-only-password@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Lint Go
        run: go vet ./...
      - name: Unit and database integration tests with race detection
        run: go test -race -count=1 -timeout=5m ./...
      - name: Build API and administration command
        run: go build ./cmd/...

  clients:
    name: ${{ matrix.project }} lint, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: https://example.invalid/api/v1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - name: Build Next.js
        if: matrix.project == 'frontend'
        run: npm run build
      - name: Export iOS and Android JavaScript bundles
        if: matrix.project == 'mobile'
        run: npm run export
