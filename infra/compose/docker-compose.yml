name: clims

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-clims_db}
      POSTGRES_USER: ${DB_USER:-clims_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment file}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
      args:
        VERSION: ${VERSION:-1.0.0}
        COMMIT_HASH: ${COMMIT_HASH:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-clims_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment file}
      DB_NAME: ${DB_NAME:-clims_db}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment file}
      PORT: 8080
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/frontend/Dockerfile
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mobile:
    build:
      context: ../../mobile
      dockerfile: ../infra/docker/mobile/Dockerfile.dev
    environment:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${MOBILE_HOST:-localhost}
      EXPO_PACKAGER_PROXY_URL: http://${MOBILE_HOST:-localhost}:${METRO_PORT:-19000}
    expose:
      - "8081"
    volumes:
      - ../../mobile:/app
      - mobile_node_modules:/app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/status').then(async r=>{if(!r.ok||!(await r.text()).includes('packager-status:running'))process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  nginx:
    image: nginx:1.30-alpine
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${METRO_PORT:-19000}:8081"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      mobile:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/_nginx/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mobile_node_modules:
