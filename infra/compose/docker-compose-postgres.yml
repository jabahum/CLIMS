version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: clims_postgres
    environment:
      POSTGRES_DB: clims_db
      POSTGRES_USER: clims_user
      POSTGRES_PASSWORD: clims_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clims-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clims_backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${PORT}
    depends_on:
      - postgres
    networks:
      - clims-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clims_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    networks:
      - clims-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: clims_nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - clims-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  clims-net:
    driver: bridge
